name: Build ForceDYKillerPrefs (arm64e)

# 手动触发：在 GitHub 仓库 Actions 页点 Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout 工程
        uses: actions/checkout@v4

      - name: 缓存 Theos 工具链
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-iphone-16.5-v1

      - name: 安装依赖与 Theos (Linux 交叉编译)
        run: |
          set -e
          if [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ] && [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ] && [ -x /usr/local/bin/ldid ]; then
            echo "===== 命中缓存，跳过下载 ====="; ls "$THEOS/sdks"; exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y clang build-essential curl xz-utils
          # GitHub release 走代理，直连时偶发 504
          dlg () {
            url="$1"; out="$2"
            for pfx in "https://ghfast.top/" "https://gh-proxy.com/" ""; do
              if sudo curl -fsSL --retry 6 --retry-delay 4 --retry-all-errors -o "$out" "$pfx$url"; then
                echo "get ok: $pfx$url"; return 0
              fi
            done
            return 1
          }
          # ldid 只是签名工具，下不到就放个空壳（deb 出厂前会用 LCSign 重签）
          LURL=https://github.com/permasigner/ldid/releases/latest/download/ldid_linux_x86_64
          sudo curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors -o /usr/local/bin/ldid "https://gh-proxy.com/$LURL" \
            || sudo curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors -o /usr/local/bin/ldid "https://ghfast.top/$LURL" \
            || sudo curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors -o /usr/local/bin/ldid "$LURL" \
            || printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ldid >/dev/null
          sudo chmod +x /usr/local/bin/ldid
          which ldid
          # Theos
          git clone --depth=1 https://github.com/theos/theos "$THEOS"
          git -C "$THEOS" submodule update --init --depth 1 vendor || true
          (cd "$THEOS/vendor" && git submodule update --init --depth 1) || true
          # Linux iOS 交叉工具链
          mkdir -p "$THEOS/toolchain"
          dlg https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz /tmp/tc.tar.xz
          sudo tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          echo "===== toolchain ====="
          ls "$THEOS/toolchain"
          # iPhoneOS SDK 16.5
          mkdir -p "$THEOS/sdks"
          dlg https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz /tmp/sdk.tar.xz
          sudo tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          echo "===== sdks ====="
          ls "$THEOS/sdks"

      - name: 编译（生成 arm64e dylib）
        run: |
          export PATH="$THEOS/bin:$PATH"
          export SDKVERSION=16.5
          make clean || true
          make
          echo "===== 产物 ====="
          find .theos -name "*.dylib" | sort

      - name: 收集产物
        run: |
          mkdir -p out/arm64e out/arm64
          cp .theos/obj/debug/arm64e/ForceDYKillerPrefs.dylib out/arm64e/ 2>/dev/null || true
          cp .theos/obj/debug/arm64/ForceDYKillerPrefs.dylib  out/arm64/  2>/dev/null || true
          echo "===== 产物 ====="
          find out -type f -exec file {} \;

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ForceDYKillerPrefs-dylib
          path: out/
