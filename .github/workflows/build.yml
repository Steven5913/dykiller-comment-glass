name: Build ForceDYKillerPrefs (arm64e)

# 手动触发：在 GitHub 仓库 Actions 页点 Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout 工程
        uses: actions/checkout@v4

      - name: 安装依赖与 Theos (Linux 交叉编译)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential ldid curl xz-utils
          git clone --depth=1 https://github.com/theos/theos "$THEOS"
          git -C "$THEOS" submodule update --init --depth 1 vendor || true
          (cd "$THEOS/vendor" && git submodule update --init --depth 1) || true
          # 下载 iPhoneOS SDK (含 arm64e)。theos/sdks release 的 asset 名形如 iPhoneOS<ver>.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          RELEASE=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest | grep -oE 'iPhoneOS[0-9]+\.[0-9]+\.sdk\.tar\.xz' | head -1)
          echo "SDK_ASSET=$RELEASE"
          curl -fsSL -o sdk.tar.xz "https://github.com/theos/sdks/releases/latest/download/$RELEASE"
          ls -la
          tar -xf sdk.tar.xz || true
          echo "===== sdks ====="
          ls "$THEOS/sdks"

      - name: 编译（生成 arm64e dylib）
        run: |
          export PATH="$THEOS/bin:$PATH"
          export SDKVERSION=$(ls "$THEOS/sdks" | grep -oE '[0-9]+\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' | head -1)
          echo "SDK=$SDKVERSION"
          make clean || true
          make
          echo "===== 产物 ====="
          find .theos -name "*.dylib" | sort

      - name: 收集产物
        run: |
          mkdir -p out/arm64e out/arm64
          cp .theos/obj/debug/arm64e/ForceDYKillerPrefs.dylib out/arm64e/ 2>/dev/null || true
          cp .theos/obj/debug/arm64/ForceDYKillerPrefs.dylib  out/arm64/  2>/dev/null || true
          echo "===== 产物 ====="
          find out -type f -exec file {} \;

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ForceDYKillerPrefs-dylib
          path: out/
