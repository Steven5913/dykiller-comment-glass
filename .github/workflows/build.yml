name: Build ForceDYKillerPrefs (arm64e)

# 手动触发：在 GitHub 仓库 Actions 页点 Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout 工程
        uses: actions/checkout@v4

      - name: 缓存 Theos 工具链
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-iphone-16.5-v1

      - name: 安装依赖与 Theos (Linux 交叉编译)
        run: |
          set -e
          if [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ] && [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ] && [ -x /usr/local/bin/ldid ]; then
            echo "===== 命中缓存，跳过下载 ====="; ls "$THEOS/sdks"; exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y clang build-essential curl xz-utils
          # GitHub release CDN 近期频繁 5xx，多镜像多轮重试
          fetch () {
            url="$1"; out="$2"; rounds="$3"
            for r in $(seq 1 "$rounds"); do
              for pfx in "https://ghfast.top/" "https://gh-proxy.com/" ""; do
                if sudo curl -fsSL --retry 2 --retry-delay 2 --retry-all-errors -o "$out" "$pfx$url"; then
                  if [ -s "$out" ] && ! head -c 200 "$out" | grep -qi "<html"; then echo "fetch ok: $pfx$url"; return 0; fi
                fi
              done
              sleep 4
            done
            return 1
          }
          LURL=https://github.com/permasigner/ldid/releases/latest/download/ldid_linux_x86_64
          if ! fetch "$LURL" /usr/local/bin/ldid 8; then
            echo "ldid 下载失败，用空壳占位（deb 出厂会重签）"
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ldid >/dev/null
          fi
          sudo chmod +x /usr/local/bin/ldid
          which ldid
          # Theos
          git clone --depth=1 https://github.com/theos/theos "$THEOS" || true
          git -C "$THEOS" submodule update --init --depth 1 vendor || true
          (cd "$THEOS/vendor" && git submodule update --init --depth 1) || true
          # Linux iOS 交叉工具链
          mkdir -p "$THEOS/toolchain"
          fetch https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz /tmp/tc.tar.xz 12
          sudo tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          echo "===== toolchain ====="
          ls "$THEOS/toolchain"
          # iPhoneOS SDK 16.5
          mkdir -p "$THEOS/sdks"
          fetch https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz /tmp/sdk.tar.xz 12
          sudo tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          echo "===== sdks ====="
          ls "$THEOS/sdks"

      - name: 编译（生成 arm64e dylib）
        run: |
          export PATH="$THEOS/bin:$PATH"
          export SDKVERSION=16.5
          make clean || true
          make
          echo "===== 产物 ====="
          find .theos -name "*.dylib" | sort

      - name: 收集产物
        run: |
          mkdir -p out/arm64e out/arm64
          cp .theos/obj/debug/arm64e/ForceDYKillerPrefs.dylib out/arm64e/ 2>/dev/null || true
          cp .theos/obj/debug/arm64/ForceDYKillerPrefs.dylib  out/arm64/  2>/dev/null || true
          echo "===== 产物 ====="
          find out -type f -exec file {} \;

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ForceDYKillerPrefs-dylib
          path: out/
