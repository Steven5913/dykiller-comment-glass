name: Build ForceDYKillerPrefs (arm64e)

# 手动触发：在 GitHub 仓库 Actions 页点 Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout 工程
        uses: actions/checkout@v4

      - name: 安装依赖与 Theos (Linux 交叉编译)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential curl xz-utils
          sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/itsnebulalol/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          which ldid || echo "ldid 下载失败"
          # Theos
          git clone --depth=1 https://github.com/theos/theos "$THEOS"
          git -C "$THEOS" submodule update --init --depth 1 vendor || true
          (cd "$THEOS/vendor" && git submodule update --init --depth 1) || true
          # Linux iOS 交叉工具链 (Theos 官方)
          mkdir -p "$THEOS/toolchain"
          curl -fsSL -o /tmp/tc.tar.xz https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          echo "===== toolchain ====="
          ls "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" 2>/dev/null | head
          # iPhoneOS SDK 16.5 (支持 arm64e)
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          echo "===== sdks ====="
          ls "$THEOS/sdks"

      - name: 编译（生成 arm64e dylib）
        run: |
          export PATH="$THEOS/bin:$PATH"
          export SDKVERSION=16.5
          make clean || true
          make
          echo "===== 产物 ====="
          find .theos -name "*.dylib" | sort

      - name: 收集产物
        run: |
          mkdir -p out/arm64e out/arm64
          cp .theos/obj/debug/arm64e/ForceDYKillerPrefs.dylib out/arm64e/ 2>/dev/null || true
          cp .theos/obj/debug/arm64/ForceDYKillerPrefs.dylib  out/arm64/  2>/dev/null || true
          echo "===== 产物 ====="
          find out -type f -exec file {} \;

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ForceDYKillerPrefs-dylib
          path: out/
