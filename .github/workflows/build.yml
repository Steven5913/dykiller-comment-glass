name: Build ForceDYKillerPrefs (arm64e)

# 手动触发：在 GitHub 仓库 Actions 页点 Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout 工程
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos "$THEOS"
          # 拉取 vendor（libsubstrate 等链接库）
          git -C "$THEOS" submodule update --init --depth 1 vendor || true
          (cd "$THEOS/vendor" && git submodule update --init --depth 1) || true
          # ldid：Theos 签名 dylib 必需
          brew install ldid || true
          # 使用 macOS runner 自带 Xcode 的 iOS SDK，避免下载几 GB 的 theos/sdks
          echo "SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          echo "SDKVERSION=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_ENV"
          which ldid || echo "ldid 仍未找到"

      - name: 编译（生成 arm64e dylib）
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make
          echo "===== 产物 ====="
          find .theos -name "*.dylib" | sort

      - name: 收集产物
        run: |
          mkdir -p out/arm64e out/arm64
          # 单独收集各架构切片
          cp .theos/obj/debug/arm64e/ForceDYKillerPrefs.dylib out/arm64e/ 2>/dev/null || true
          cp .theos/obj/debug/arm64/ForceDYKillerPrefs.dylib  out/arm64/  2>/dev/null || true
          # lipo 合并成 fat（arm64 + arm64e）
          lipo -create \
              .theos/obj/debug/arm64/ForceDYKillerPrefs.dylib \
              .theos/obj/debug/arm64e/ForceDYKillerPrefs.dylib \
              -output out/ForceDYKillerPrefs-fat.dylib 2>/dev/null || true
          echo "===== 产物 ====="
          find out -type f -exec file {} \;

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ForceDYKillerPrefs-dylib
          path: out/
